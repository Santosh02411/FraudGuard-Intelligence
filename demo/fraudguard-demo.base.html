<!doctype html>
<html lang="en">

    <style>

        place-items: center;

        gap: 9px;

      #main {

        gap: 12px;

      #top .sp {

        align-items: center;
        gap: 7px;
        font-size: 12px;
        padding: 4px 11px;
        border-radius: 99px;
        border: 1px solid var(--line);
        color: var(--mut);
        background: rgba(255, 255, 255, 0.03);
      }
      .pill.live {
        color: var(--gr);
        border-color: rgba(52, 211, 153, 0.25);
        background: rgba(52, 211, 153, 0.06);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        display: inline-block;
      }
      .live .dot {
        animation: ping 1.6s infinite;
      }
      @keyframes ping {
        0% {
          box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6);

      @keyframes pin {
        from {

        }
        to {

          transform: none;

  <body>
    <div id="root"></div>
    <div id="toasts"></div>
    <div id="modal">
      <div class="box">
        <button class="x" onclick="closeModal()">×</button>
        <div id="mbody"></div>
      </div>
    </div>
    <script>
      /* =====================================================================
   FraudGuard demo — core: utils, seeded RNG, the hybrid fraud engine
   (a faithful JS port of backend/models/fraudEngine.js + riskPolicy.js
   + verificationPolicy.js, with a synthetic stand-in for the ML model)
   ===================================================================== */
      const $ = (s, r = document) => r.querySelector(s);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const money = (n, d = 2) =>
        "$" +
        Number(n || 0).toLocaleString("en-US", {
          minimumFractionDigits: d,
          maximumFractionDigits: d,
        });
      const pct = (v, d = 1) =>
        v === null || v === undefined || isNaN(v)
          ? "—"
          : (v * 100).toFixed(d) + "%";
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      const fdate = (t) =>

      /* ---------- Layer 3: rule-engine fallback ---------- */
      function ruleEngine(t, hist, now) {
        let s = 0;

          s += 25;
          r.push(`Suspicious transaction category: ${t.category}`);
        }
        if (
          HIGH_RISK_LOCATIONS.some((l) =>
            t.location.toLowerCase().includes(l.toLowerCase()),

        ) {
          s += 20;
          r.push(`High-risk location: ${t.location}`);

        const rc = hist.filter((x) => now - x.created_at < H).length;
        if (rc >= 5) {
          s += 25;

      function features(t, hist, now) {

        const known = new Set(hist.map((h) => h.device)),
          ips = new Set(hist.map((h) => h.ip));
        const home = t.home || (hist[0] && hist[0].home) || t.location;
        const hr = new Date(now).getHours();
        return {
          ratio: med ? t.amount / med : t.amount > 400 ? 3 : 1,
          median: med,

          "ratio to median purchase price",
          f.ratio > 1.4 ? Math.min(0.95 * Math.log(f.ratio), 3.1) : -0.25,

        add(
          "IP status: " + f.ip_status,

      function spec(u, p) {
        const m = p.merchant || pick(MAINSTREAM);
        return Object.assign(
          {
            user: u,
            merchant: m,
            category: p.category || pick(MERCHANTS[m] || ["electronics"]),
            location: u.home,
            card_type: pick(
              ["credit", "credit", "debit", "debit", "prepaid"].slice(
                0,
                chance(0.9) ? 4 : 5,
              ),
            ),
            device: u.device,
            ip: u.ip,
            truth: false,
            scenario: "normal",
          },
          p,
          { merchant: m },
        );
      }
      function dayTime(daysAgo) {
        const d = new Date(NOW0 - daysAgo * D);
        d.setHours(
          Math.floor(rr(8, 22)),
          Math.floor(rr(0, 60)),
          Math.floor(rr(0, 60)),
        );
        return Math.min(d.getTime(), NOW0 - 3 * 60e3);
      }

      function buildSpecs() {
        const specs = [];
        S.users.forEach((u) => {
          const n = Math.floor(rr(9, 16));
          for (let i = 0; i < n; i++) {
            const big = chance(0.06);
            const m = pick(MAINSTREAM),
              amt = clamp(
                u.median * (big ? rr(2.2, 4.2) : Math.exp(rr(-0.7, 0.7))),
                3.5,
                1900,
              );
            specs.push(
              spec(u, {
                merchant: m,
                amount: +amt.toFixed(2),
                created_at: dayTime(rr(0, 14)),
                scenario: big ? "big-legit" : "normal",
              }),
            );
          }
        });
        // travellers (legit, far from home — classic false positives)
        [0, 6, 12, 20].forEach((ui) => {
          const u = S.users[ui],
            loc = pick(
              [
                "London, UK",
                "Singapore, SG",
                "Sydney, AU",
                "Berlin, DE",
              ].filter((x) => x !== u.home),
            ),
            t0 = dayTime(rr(1, 9));
          for (let k = 0; k < 3; k++)
            specs.push(
              spec(u, {
                merchant: pick(["Airbnb", "Uber", "Apple Store"]),
                amount: +rr(180, 900).toFixed(2),
                location: loc,
                created_at: t0 + k * 3 * H,
                scenario: "travel-legit",
              }),
            );
        });
        // account takeovers: new device, far away, big ticket
        [1, 5, 7, 13, 16, 21, 24, 26].forEach((ui, k) => {
          const u = S.users[ui],
            dev = "dev-" + hex(8),
            loc = pick(
              ["Lagos, NG", "Unknown", "Singapore, SG", "Berlin, DE"].filter(
                (x) => x !== u.home,
              ),
            ),
            t0 = dayTime(rr(0.1, 11)),
            t1 = new Date(t0);
          t1.setHours(2 + (k % 3), 14 + k * 3);
          for (let j = 0; j < (k % 3) + 1; j++)
            specs.push(
              spec(u, {
                merchant: pick(["Apple Store", "Amazon", "CryptoExchange Pro"]),
                amount: +(u.median * rr(9, 26)).toFixed(2),
                location: loc,
                device: dev,
                ip: `185.220.${Math.floor(rr(1, 200))}.${Math.floor(rr(1, 200))}`,
                created_at: t1.getTime() + j * 11 * 60e3,
                truth: true,
                scenario: "ato",
              }),
            );
        });
        // crypto / prepaid velocity bursts
        [8, 15, 23].forEach((ui, k) => {
          const u = S.users[ui],
            t0 = dayTime(rr(0.05, 8));
          for (let j = 0; j < 5 + k; j++)
            specs.push(
              spec(u, {
                merchant: j % 2 ? "Casino Vegas" : "CryptoExchange Pro",
                amount: +rr(120, 700).toFixed(2),
                card_type: "prepaid",
                created_at: t0 + j * 6 * 60e3,
                truth: true,
                scenario: "burst",
              }),
            );
        });
        // anonymous-proxy / blacklisted-merchant hits (hard rules)
        [2, 10, 18].forEach((ui) => {
          const u = S.users[ui];
          specs.push(
            spec(u, {
              merchant: pick(["DarkNet Market", "FastCash Wire Instant"]),
              amount: +rr(300, 2800).toFixed(2),
              location: "Anonymous Proxy",
              ip: "10.66." + Math.floor(rr(1, 200)) + ".4",
              created_at: dayTime(rr(0.1, 12)),
              truth: true,
              scenario: "proxy",
            }),
          );
        });
        specs.push(
          spec(S.users[27], {
            merchant: "Apple Store",
            amount: 11840,
            created_at: dayTime(3),
            scenario: "cap",
            truth: true,
          }),
        ); // over the absolute cap
        specs.push(
          spec(S.users[29], {
            merchant: "Apple Store",
            amount: 12400,
            created_at: dayTime(6.2),
            scenario: "cap",
            truth: false,
          }),
        ); // legit but capped (false positive by design)
        // ring A: compromised device pool fans out across accounts, spread over ~9 days
        S.users
          .filter((u) => u.ring === "A")
          .forEach((u, k) => {
            for (let j = 0; j < 4; j++)
              specs.push(
                spec(u, {
                  merchant: pick([
                    "Apple Store",
                    "Amazon",
                    "CryptoExchange Pro",
                  ]),
                  amount: +rr(380, 1700).toFixed(2),
                  ip: RING_A.ip,
                  device: u.ringDevice,
                  created_at: dayTime(9 - k * 1.5 - j * 0.9),
                  truth: true,
                  scenario: "ring",
                }),
              );
          });
        // ring A bridge account (only shares the IP) — legit spending, linked only transitively
        for (let j = 0; j < 3; j++)
          specs.push(
            spec(S.users[11], {
              amount: +rr(30, 90).toFixed(2),
              ip: RING_A.ip,
              created_at: dayTime(rr(0.3, 8)),
            }),
          );
        // ring B: IP shared by three accounts, normal-looking (watch list, no confirmed fraud)
        S.users
          .filter((u) => u.ring === "B")
          .forEach((u) => {
            for (let j = 0; j < 3; j++)
              specs.push(
                spec(u, {
                  amount: +rr(25, 200).toFixed(2),
                  ip: RING_B.ip,
                  device: u.ringDevice,
                  created_at: dayTime(rr(0.2, 10)),
                }),
              );
          });
        // "missed" fraud: the model scores it low (small, familiar pattern) — surfaces later as customer disputes
        [4, 9, 17, 22].forEach((ui) => {
          const u = S.users[ui];
          specs.push(
            spec(u, {
              merchant: pick(["Netflix", "Starbucks", "Uber"]),
              amount: +(u.median * rr(1.3, 2)).toFixed(2),
              created_at: dayTime(rr(2, 12)),
              truth: true,
              scenario: "missed",
            }),
          );
        });
        return specs;
      }

      const RING_A_DEV = new Set([RING_A.device, RING_A.device2]);
      function buildTransactions() {
        const specs = buildSpecs().sort((a, b) => a.created_at - b.created_at);
        const hist = new Map();
        const ringFraudSeen = { A: false };
        for (const sp of specs) {
          const u = sp.user,
            h = hist.get(u.id) || [];
          const t = {
            amount: sp.amount,
            merchant: sp.merchant,
            category: sp.category,
            location: sp.location,
            card_type: sp.card_type,
            device: sp.device,
            ip: sp.ip,
            created_at: sp.created_at,
            home: u.home,
          };
          let net = { triggered: false };
          if (RING_A_DEV.has(sp.device) && !ringFraudSeen.A)
            net = {
              triggered: true,
              reason: `This device/IP is shared with 4 other account(s) — an unusually large cluster with no confirmed fraud yet, worth a closer look`,
            };
          if (sp.ip === RING_B.ip)
            net = {
              triggered: true,
              reason:
                "This device/IP is shared with 2 other account(s) — an unusually large cluster with no confirmed fraud yet, worth a closer look",
            };
          if (sp.scenario === "missed") net = { triggered: false };
          let a = analyze(t, h, { network: net });
          if (sp.scenario === "missed") {
            // model genuinely missed it: low score, no reasons, no guard
            a = Object.assign(a, {
              fraud_score: +rr(2.5, 9).toFixed(1),
              risk_level: "low",
              is_fraud: 0,
              scoring_method: "ml_model",
              fraud_reasons: [],
              hard_flag_triggered: null,
            });
            a.shap_explanation = [
              {
                feature: "ratio to median purchase price",
                shap_value: 0.12,
                effect: "increased_risk",
              },
              {
                feature: "category: " + sp.category,
                shap_value: -0.08,
                effect: "decreased_risk",
              },
              {
                feature: "is new device",
                shap_value: -0.14,
                effect: "decreased_risk",
              },
            ];
            a.verification = verify("low", sp.amount);
          }
          const txn = Object.assign(
            {
              id: S.nextTxn++,
              user_id: u.id,
              username: u.username,
              amount: sp.amount,
              merchant: sp.merchant,
              category: sp.category,
              location: sp.location,
              card_type: sp.card_type,
              device: sp.device,
              ip: sp.ip,
              created_at: sp.created_at,
              home: u.home,
              truth: sp.truth,
              scenario: sp.scenario,
              synthetic: false,
            },
            pickAnalysis(a),
          );
          finalizeStatus(txn);
          S.txns.push(txn);
          h.push(txn);
          hist.set(u.id, h);
          if (
            sp.truth &&
            sp.created_at < NOW0 - 4 * D &&
            sp.scenario !== "missed"
          ) {
            if (RING_A_DEV.has(sp.device)) ringFraudSeen.A = true;
            CFG.dynBlacklist.devices.add(sp.device);
            if (sp.scenario === "ring") CFG.dynBlacklist.ips.add(sp.ip);
          }
        }
        S.txns.sort((a, b) => b.created_at - a.created_at);
      }
      function pickAnalysis(a) {
        return {
          fraud_score: a.fraud_score,
          risk_level: a.risk_level,
          is_fraud: a.is_fraud,
          fraud_reasons: a.fraud_reasons,
          scoring_method: a.scoring_method,
          hard_flag_triggered: a.hard_flag_triggered,
          ml_score_for_reference: a.ml_score_for_reference ?? null,
          model_probability: a.model_probability,
          shap_explanation: a.shap_explanation,
          model_used: a.model_used,
          model_version: a.model_version,
          rule_engine_score: a.rule_engine_score,
          policy_version: a.policy_version,
          ml_latency_ms: a.ml_latency_ms,
          features: a.features,
          verification: a.verification,
        };
      }
      function finalizeStatus(t) {
        t.status = "approved";
        t.step_up = null;
        const v = t.verification;
        if (t.synthetic) return;
        if (v.effective === "decline") t.status = "declined";
        else if (v.effective === "challenge") {
          const age = Date.now() - t.created_at;
          let st = "pending";
          if (age > 40 * 60e3)
            st = t.truth
              ? pick(["failed", "expired", "failed", "abandoned"])
              : pick([
                  "verified",
                  "verified",
                  "verified",
                  "expired",
                  "abandoned",
                ]);
          t.step_up = {
            status: st,
            issued_at: t.created_at,
            expires_at: t.created_at + CFG.verification.ttl_seconds * 1000,
            completed_at:
              st === "verified" || st === "failed"
                ? t.created_at + Math.round(rr(20, 140)) * 1000
                : null,
          };
          t.status =
            st === "pending"
              ? "held"
              : st === "verified"
                ? "approved"
                : "blocked";
        }
      }

      function buildAlerts() {
        const analysts = ["sara.analyst", "ravi.analyst", "admin"];
        const list = S.txns
          .filter((t) => t.risk_level !== "low")
          .sort((a, b) => a.created_at - b.created_at);
        for (const t of list) {
          const sev = t.risk_level,
            due = t.created_at + (sev === "high" ? 4 : 24) * H,
            age = Date.now() - t.created_at;
          const al = {
            id: S.nextAlert++,
            transaction_id: t.id,
            severity: sev,
            created_at: t.created_at,
            due_at: due,
            status: "open",
            assigned_to: null,
            notes: [],
            audit: [
              {
                at: t.created_at,
                who: "system",
                what: `Alert created — ${sev} risk (score ${t.fraud_score})`,
              },
            ],
            outcome: null,
            resolved_at: null,
            resolved_by: null,
            claim: null,
            case_id: null,
          };
          if (age > 22 * H || chance(0.15)) {
            if (age > 20 * H && chance(0.8)) {
              const by = pick(analysts),
                at = t.created_at + rr(0.4, 9) * H;
              al.status = "resolved";
              al.resolved_by = by;
              al.resolved_at = Math.min(at, Date.now() - 600e3);
              al.assigned_to = by;
              al.outcome = t.truth
                ? chance(0.93)
                  ? "confirmed_fraud"
                  : "false_positive"
                : chance(0.88)
                  ? "false_positive"
                  : "confirmed_fraud";
              al.audit.push(
                {
                  at: al.resolved_at - 4 * 60e3,
                  who: by,
                  what: "Assigned to self",
                },
                {
                  at: al.resolved_at,
                  who: by,
                  what: `Resolved — ${al.outcome.replace("_", " ")}`,
                },
              );
              if (al.outcome === "confirmed_fraud")
                al.notes.push({
                  at: al.resolved_at - 120e3,
                  who: by,
                  text: pick([
                    "Customer confirmed they did not make this purchase. Card frozen and reissued.",
                    "Device fingerprint matches known fraud pattern; confirmed via phone call.",
                    "Cardholder unreachable; velocity + new device + crypto merchant = confirmed.",
                  ]),
                });
              else
                al.notes.push({
                  at: al.resolved_at - 120e3,
                  who: by,
                  text: pick([
                    "Customer verified via OTP — travelling for work.",
                    "Legit: large purchase pre-announced by customer in app chat.",
                    "Known merchant, normal for this customer. Closing as false positive.",
                  ]),
                });
            } else {
              al.status = pick(["in_review", "escalated", "pending_info"]);
              al.assigned_to = pick(analysts);
              al.audit.push({
                at: t.created_at + 2 * H,
                who: al.assigned_to,
                what: `Status → ${al.status.replace("_", " ")}`,
              });
            }
          } else if (chance(0.35)) {
            al.status = "in_review";
            al.assigned_to = pick(analysts);
            al.audit.push(
              {
                at: t.created_at + 30 * 60e3,
                who: al.assigned_to,
                what: "Assigned to self",
              },
              {
                at: t.created_at + 31 * 60e3,
                who: al.assigned_to,
                what: "Status → in review",
              },
            );
          }
          al.overdue = al.status !== "resolved" && Date.now() > due;
          S.alerts.push(al);
        }
        S.alerts.sort((a, b) => b.created_at - a.created_at);
      }
      const alertOf = (txnId) =>
        S.alerts.find((a) => a.transaction_id === txnId);
      const txnOf = (id) => S.txns.find((t) => t.id === id);

      function buildDisputes() {
        let id = 201;
        const reasons = [
          "I don't recognize this charge",
          "Item never arrived",
          "Billed twice",
          "Card was stolen",
          "Unauthorized transaction after phone theft",
        ];
        const fraud = S.txns.filter(
          (t) => t.truth && Date.now() - t.created_at > 2 * D,
        );
        const missed = S.txns.filter((t) => t.scenario === "missed");
        const picks = [...missed, ...fraud.filter(() => chance(0.16))].slice(
          0,
          12,
        );
        picks.forEach((t) => {
          const st =
            t.scenario === "missed"
              ? pick(["open", "evidence_submitted", "won"])
              : pick(["open", "evidence_submitted", "won", "won", "lost"]);
          S.disputes.push({
            id: id++,

            amount: t.amount,
            disputed_amount: t.amount,

            status: st,
            created_at: t.created_at + rr(0.5, 3) * D,
            missed: t.scenario === "missed",
          });
        });
        S.txns
          .filter(
            (t) =>
              !t.truth &&
              t.risk_level === "low" &&
              Date.now() - t.created_at > 4 * D &&
              chance(0.015),
          )
          .slice(0, 2)
          .forEach((t) =>
            S.disputes.push({
              id: id++,
              transaction_id: t.id,
              user: t.username,
              amount: t.amount,
              disputed_amount: t.amount,
              reason: "Billed twice",
              status: "lost",
              created_at: t.created_at + 2 * D,
              missed: false,

        S.disputes.sort((a, b) => b.created_at - a.created_at);
      }

      function buildCases() {
        const mk = (title, status, priority, scen, owner, outcome) => {
          const ts = S.txns.filter(scen);
          const als = ts.map((t) => alertOf(t.id)).filter(Boolean);
          const c = {
            id: S.nextCase++,
            title,
            status,
            priority,
            assignee: owner,
            outcome,
            alerts: als.map((a) => a.id),
            txns: ts.map((t) => t.id),
            created_at: Math.min(...ts.map((t) => t.created_at)) + 3 * H,
            updated_at: NOW0 - rr(1, 30) * H,
            timeline: [],
            closing_note: null,
          };
          als.forEach((a) => {
            a.case_id = c.id;
          });
          c.timeline.push({
            at: c.created_at,
            who: owner,
            text: `Case opened with ${als.length} alert(s) and ${ts.length} transaction(s)`,
            kind: "created",
          });
          c.timeline.push({
            at: c.created_at + 2 * H,
            who: owner,
            text: "Linked entities reviewed: shared device and IP across accounts",
            kind: "note",
          });
          if (status === "closed")
            c.timeline.push({
              at: c.updated_at,
              who: owner,
              text: `Case closed — ${outcome.replace("_", " ")}`,
              kind: "closed",
            });
          S.cases.push(c);
        };
        mk(
          "Ring A — shared device pool, 5 accounts",
          "investigating",
          "high",
          (t) => t.scenario === "ring",
          "sara.analyst",
          null,
        );
        mk(
          "Crypto/prepaid velocity bursts",
          "open",
          "medium",
          (t) => t.scenario === "burst",
          "ravi.analyst",
          null,
        );
        mk(
          "Account takeovers — new device, far geography",
          "closed",
          "high",
          (t) => t.scenario === "ato" && t.created_at < NOW0 - 5 * D,
          "sara.analyst",
          "confirmed_fraud",
        );
        mk(
          "Anonymous proxy / blacklisted merchant hits",
          "pending_info",
          "medium",
          (t) => t.scenario === "proxy",
          "admin",
          null,
        );
      }

      function buildRings() {
        // connected components over account–device / account–ip links (exclude IPs only ever used by one account)
        const links = new Map();
        S.txns.forEach((t) => {
          [
            ["d:" + t.device, "device"],
            ["i:" + t.ip, "ip"],
          ].forEach(([k]) => {
            if (!links.has(k)) links.set(k, new Set());
            links.get(k).add(t.user_id);
          });
        });
        const shared = [...links].filter(
          ([, s]) =>
            s.size >= 2 && !/^i:(185\.220|10\.66)/.test(links.has ? "" : ""),
        );
        const parent = {};
        const find = (x) =>
          parent[x] === undefined || parent[x] === x
            ? (parent[x] = x)
            : (parent[x] = find(parent[x]));
        shared.forEach(([k, s]) => {
          const ids = [...s].filter(
            (id) => !(k.startsWith("i:185.220") || k.startsWith("i:10.66")),
          );
          ids.forEach((i) => find(i));
          for (let i = 1; i < ids.length; i++)
            parent[find(ids[i])] = find(ids[0]);
        });
        const groups = {};
        Object.keys(parent).forEach((i) => {
          const r = find(+i);
          (groups[r] = groups[r] || []).push(+i);
        });
        let n = 1;
        Object.values(groups)
          .filter((g) => g.length >= 3)
          .forEach((g) => {
            const members = S.users.filter((u) => g.includes(u.id)),
              ids = new Set(g);
            const ds = new Set(),
              ips = new Set();
            shared.forEach(([k, s]) => {
              if (
                [...s].some((x) => ids.has(x)) &&
                ![...s].every((x) => false) &&
                !(k.startsWith("i:185.220") || k.startsWith("i:10.66"))
              ) {
                if (k.startsWith("d:")) ds.add(k.slice(2));
                else ips.add(k.slice(2));
              }
            });
            const conf = members.filter((u) =>
              S.alerts.some(
                (a) =>
                  a.outcome === "confirmed_fraud" &&
                  txnOf(a.transaction_id).user_id === u.id,
              ),
            );
            const tx = S.txns.filter((t) => ids.has(t.user_id));
            S.rings.push({
              id: n++,
              members,
              devices: [...ds],
              ips: [...ips],
              confirmed: conf,
              txns: tx.length,
              total: tx.reduce((a, t) => a + t.amount, 0),
              flagged: tx.filter((t) => t.risk_level !== "low").length,
              status: conf.length ? "confirmed" : "watch",
            });
          });
        S.rings.sort(
          (a, b) =>
            b.confirmed.length - a.confirmed.length ||
            b.members.length - a.members.length,
        );
      }

      function buildLabels() {
        let id = 1;
        S.alerts
          .filter((a) => a.status === "resolved")
          .slice(0, 40)
          .forEach((a, i) => {
            const t = txnOf(a.transaction_id),
              st =
                i < 22
                  ? "verified"
                  : i < 30
                    ? "proposed"
                    : i < 33
                      ? "rejected"
                      : "verified";
            S.labels.push({
              id: id++,
              transaction_id: t.id,
              label: a.outcome === "confirmed_fraud" ? "fraud" : "legitimate",
              status: st,
              source: i % 4 ? "analyst_verdict" : "manual",
              proposed_by: a.resolved_by,
              created_at: a.resolved_at + 60e3,

    ${gauge(t.fraud_score)}

    ${t.hard_flag_triggered ? `<div class="err-box" style="margin-top:12px"><b>Hard-rule override</b> — score forced to 100 regardless of the model${t.ml_score_for_reference != null ? ` (the model alone said <b>${t.ml_score_for_reference}</b>)` : ""}.</div>` : ""}
    ${t.ml_score_for_reference != null && !t.hard_flag_triggered ? `<div class="note" style="margin-top:12px"><b>Calibration floor:</b> model scored ${t.ml_score_for_reference}, raised to ${CFG.policy.medium_threshold} (medium) because the amount is far outside the account's normal range.</div>` : ""}
    <div class="grid g2" style="margin-top:12px"><div><h3 style="margin-top:0">Risk factors</h3>${t.fraud_reasons.length ? `<ul class="reasons">${t.fraud_reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>` : '<p class="sub">No risk factors — looks like ordinary behaviour for this account.</p>'}</div><div>${shapChart(t.shap_explanation)}</div></div>
    ${t.step_up && t.step_up.status === "pending" ? stepUpBox(t) : ""}

      function stepUpBox(t) {
        return `<div class="info" style="margin-top:12px"><b>Step-up required.</b> The transaction is held until the customer completes a challenge (TTL ${CFG.verification.ttl_seconds}s). In production, your payment system runs the OTP / 3-D Secure and reports back; here you can play the customer.<div class="row" style="margin-top:8px"><input id="otp-${t.id}" placeholder="Enter code (demo: 123456)" style="max-width:220px"><button class="btn grn sm" data-act="otp" data-arg="${t.id}">Verify</button><button class="btn red sm" data-act="otpFail" data-arg="${t.id}">Customer abandons</button></div></div>`;

      function readSim() {

          form.ipk === "new"

          {
            user: u,
            amount: form.amount,

            category: form.category,

      const SAMPLE_CSV = `amount,merchant,category,location,card_type
42.50,Whole Foods,grocery,New York,debit
18.20,Starbucks,food,New York,credit
129.99,Netflix,entertainment,New York,credit
860.00,Airbnb,travel,Berlin DE,credit
2450.00,Apple Store,electronics,New York,credit
310.00,CryptoExchange Pro,crypto,Singapore SG,prepaid
95.00,Casino Vegas,gambling,New York,prepaid
1250.00,FastCash Wire Instant,wire_transfer,Anonymous Proxy,credit
12999.00,Apple Store,electronics,New York,credit

    "Score as customer",

  <div class="card"><h2>Results</h2>${r ? `<div class="grid g4" style="margin-bottom:12px">${stat("Completed", r.ok, "", CLR.lo)}${stat("Flagged", r.flagged, "", CLR.me)}${stat("Held for step-up", r.held, "", CLR.pu)}${stat("Rejected rows", r.bad, "", r.bad ? CLR.hi : "")}</div><div class="tw" style="max-height:380px"><table><thead><tr><th>#</th><th>Amount</th><th>Merchant</th><th>Risk</th><th>Score</th><th>Action</th></tr></thead><tbody>${r.rows.map((x) => (x.err ? `<tr><td>${x.i}</td><td colspan="5" style="color:#f87171">${esc(x.err)}</td></tr>` : `<tr class="clk" onclick="location.hash='#/transactions/${x.t.id}'"><td>${x.i}</td><td class="num">${money(x.t.amount)}</td><td>${esc(x.t.merchant)}</td><td>${bdgRisk(x.t.risk_level)}</td><td>${scoreBar(x.t.fraud_score)}</td><td>${statusBdg(x.t.status)}</td></tr>`)).join("")}</tbody></table></div>` : '<div class="empty">Paste CSV (or use the sample, which contains normal, risky and hard-rule rows) and click <b>Score batch</b>.</div>'}</div></div>`;
      };
      Object.assign(ACT, {

            head = lines
              .shift()
              .split(",")
              .map((s) => s.trim().toLowerCase()),
            res = { rows: [], ok: 0, flagged: 0, held: 0, bad: 0 };
          if (

          lines.slice(0, 500).forEach((ln, i) => {
            const c = ln.split(",").map((s) => s.trim()),
              o = {};
            head.forEach((h, k) => (o[h] = c[k]));
            if (!(Number(o.amount) > 0)) {
              res.bad++;
              res.rows.push({
                i: i + 1,
                err: `Row ${i + 1}: invalid amount "${o.amount}"`,
              });
              return;
            }
            if (!["credit", "debit", "prepaid"].includes(o.card_type)) {
              res.bad++;
              res.rows.push({
                i: i + 1,

            const t = submitTxn({

              amount: o.amount,

              card_type: o.card_type,

  <div class="card p0"><div class="tw">${txnTable(rows)}</div>${pager(list.length, pg, per, "txPage")}</div>`;

      /* ---------------- Transaction detail ---------------- */
      V.txnDetail = (id) => {

  <div class="ph"><div><h1>${esc(t.merchant)} ${t.synthetic ? '<span class="bdg gy n">simulated</span>' : ""}</h1><p>Transaction #${t.id} · ${esc(t.username)} · ${fdate(t.created_at)}</p></div><div class="r">${bdgRisk(t.risk_level)}${statusBdg(t.status)}</div></div>
  <div class="grid g2"><div class="card"><h2>Details</h2><dl class="kv"><dt>Amount</dt><dd class="num"><b>${money(t.amount)}</b></dd><dt>Category</dt><dd style="text-transform:capitalize">${t.category.replace("_", " ")}</dd><dt>Location</dt><dd>${t.location} <span class="dim">(home: ${t.home})</span></dd><dt>Card type</dt><dd style="text-transform:capitalize">${t.card_type}</dd><dt>Device</dt><dd class="mono">${t.device}</dd><dt>IP</dt><dd class="mono">${t.ip}</dd><dt>Fraud score</dt><dd>${scoreBar(t.fraud_score)}</dd></dl>
      <h3>Behavioural features the model saw</h3><dl class="kv"><dt>Ratio to usual spend</dt><dd>${f.ratio ? f.ratio.toFixed(1) + "×" : "—"} <span class="dim">${f.median ? "(median " + money(f.median, 0) + ")" : "(no baseline)"}</span></dd><dt>Distance from home</dt><dd>${Math.round(f.distance || 0).toLocaleString()} km</dd><dt>Velocity, last hour</dt><dd>${f.velocity ?? 0} prior txns</dd><dt>New device</dt><dd>${f.new_device ? "yes" : "no"}</dd><dt>IP status</dt><dd>${f.ip_status || "—"}</dd></dl></div>
    <div class="card"><h2>Decision</h2><dl class="kv"><dt>Scoring method</dt><dd><span class="bdg gy n">${t.scoring_method}</span></dd><dt>Model</dt><dd>${t.model_used ? `${t.model_used} ${t.model_version}` : '<span class="mut">none (fallback)</span>'}</dd><dt>Model probability</dt><dd>${t.model_probability != null ? (t.model_probability * 100).toFixed(2) + "%" : "—"}</dd><dt>Rule-engine score</dt><dd>${t.rule_engine_score}</dd><dt>Risk policy</dt><dd>v${t.policy_version}</dd><dt>ML latency</dt><dd>${t.ml_latency_ms ? t.ml_latency_ms + " ms" : "—"}</dd><dt>Verification</dt><dd>mode <b>${v.mode}</b> · recommended <b>${v.recommended}</b> · effective <b>${v.effective}</b></dd></dl>
      ${t.hard_flag_triggered ? `<div class="err-box" style="margin-top:10px"><b>Hard rule triggered</b><ul class="reasons">${t.hard_flag_triggered.map((r) => `<li>${esc(r)}</li>`).join("")}</ul></div>` : ""}
      ${al ? `<p style="margin:12px 0 0">Alert <a href="#/alerts" onclick="UI.alerts.open=${al.id}">#${al.id}</a> ${statusBdg(al.status)} ${al.outcome ? `<span class="bdg ${al.outcome === "confirmed_fraud" ? "hi" : "ok"} n">${al.outcome.replace("_", " ")}</span>` : ""}</p>` : ""}</div></div>

  ${t.step_up ? `<div class="card" style="margin-top:14px"><h2>Step-up verification ${statusBdg(t.step_up.status)}</h2><dl class="kv"><dt>Issued</dt><dd>${fdate(t.step_up.issued_at)}</dd><dt>Expires</dt><dd>${fdate(t.step_up.expires_at)}</dd><dt>Completed</dt><dd>${t.step_up.completed_at ? fdate(t.step_up.completed_at) : "—"}</dd></dl>${t.step_up.status === "pending" ? stepUpBox(t) : ""}</div>` : ""}
  <div class="card" style="margin-top:14px"><h2>Decision history <span class="sub">— audit snapshot</span></h2><dl class="kv"><dt>Rule set</dt><dd>v${CFG.rules.version}</dd><dt>Thresholds at decision</dt><dd>review ≥ ${CFG.policy.medium_threshold} · fraud ≥ ${CFG.policy.high_threshold} (policy v${t.policy_version})</dd><dt>Features stored</dt><dd>behavioural only — no raw IP or device fingerprint in the model payload</dd></dl>
    <div class="row" style="margin-top:10px"><button class="btn" data-act="rescore" data-arg="${t.id}">Rescore with the current model and rules</button><span class="hint">Replays this transaction against today's thresholds, blacklists and model — useful before/after a rule change.</span></div>

  <div class="card" style="margin-top:14px"><h2>${ico("scale", 16)} Dispute</h2>${ds ? `<p>Dispute #${ds.id} ${statusBdg(ds.status)} · ${money(ds.disputed_amount)} · “${esc(ds.reason)}”</p>` : `<div class="row">${field("Why are you disputing this charge?", `<input id="d-reason" placeholder="I don't recognize this charge / billed twice …">`)}${field("Amount (optional)", `<input id="d-amt" type="number" placeholder="${t.amount.toFixed(2)}">`, "fl")}<button class="btn" style="align-self:flex-end" data-act="openDispute" data-arg="${t.id}">Open dispute</button></div>`}</div>`;

      /* =====================================================================
   Views 2: alerts · disputes · analytics · live feed · cases ·

   ===================================================================== */
      /* ---------------- Alerts ---------------- */
      const STATUSES = [
        "open",

      ];
      function slaText(a) {

  ${isAdmin() ? `<div class="card" style="margin-bottom:14px"><h2>Team queue <span class="sub" style="font-weight:400">· resolved figures cover the last 7 days</span></h2><div class="grid g5">${stat("Open queue", act.length, "", CLR.bl)}${stat("Escalated", act.filter((a) => a.status === "escalated").length, "", CLR.or)}${stat("Overdue", act.filter((a) => Date.now() > a.due_at).length, "", CLR.hi)}${stat("Resolved (7d)", res.length, "", CLR.lo, `${conf} confirmed fraud`)}${stat("Median time to resolve", (tts.length ? tts[tts.length >> 1].toFixed(1) : "—") + " h", "", CLR.pu)}</div></div>` : ""}
  <div class="card" style="margin-bottom:14px"><div class="row">${field("Search", `<input value="${esc(f.q || "")}" placeholder="merchant or customer" onchange="ACT.alf('q',this.value)">`)}${field(
    "Status",
    `<select onchange="ACT.alf('status',this.value)">${opts(
      STATUSES.map((s) => [s, s.replace("_", " ")]),
      f.status,
      "All",
    )}</select>`,
  )}${field("Severity", `<select onchange="ACT.alf('sev',this.value)">${opts(["high", "medium"], f.sev, "All")}</select>`)}<label class="row sub" style="align-self:flex-end;gap:6px;height:34px"><input type="checkbox" ${f.mine ? "checked" : ""} onchange="ACT.alf('mine',this.checked)"> Assigned to me</label><label class="row sub" style="align-self:flex-end;gap:6px;height:34px"><input type="checkbox" ${f.overdue ? "checked" : ""} onchange="ACT.alf('overdue',this.checked)"> Overdue only</label></div>
  ${sel.size ? `<div class="row" style="margin-top:12px"><b>${sel.size} selected</b><button class="btn sm grn" data-act="alBulk" data-arg="false_positive">Resolve as false positive</button><button class="btn sm red" data-act="alBulk" data-arg="confirmed_fraud">Resolve as confirmed fraud</button><button class="btn sm" data-act="alSelClear">Clear</button></div>` : ""}</div>
  <div class="card p0"><div class="hd"><h2>${list.length} alert${list.length === 1 ? "" : "s"}</h2><span class="sub">worked newest-first</span></div>${rows.length ? rows.map(alertRow).join("") : '<div class="empty">All clear — no alerts match these filters.</div>'}${pager(list.length, pg, per, "alPage")}</div>`;
      };
      function alertRow(a) {

        return `<div style="border-bottom:1px solid var(--line2);${open ? "background:rgba(255,255,255,.025)" : ""}"><div class="row" style="padding:12px 16px;gap:12px;flex-wrap:nowrap"><input type="checkbox" ${sel ? "checked" : ""} ${a.status === "resolved" ? "disabled" : ""} onchange="ACT.alSel(${a.id})"><div style="flex:1;min-width:0;cursor:pointer" data-act="alOpen" data-arg="${a.id}"><div class="row" style="gap:8px"><b>${esc(t.merchant)}</b><span class="num">${money(t.amount)}</span>${bdgRisk(a.severity)}${statusBdg(a.status)}${a.outcome ? `<span class="bdg ${a.outcome === "confirmed_fraud" ? "hi" : "ok"} n">${a.outcome.replace("_", " ")}</span>` : ""}${a.case_id ? `<span class="bdg pu n">case #${a.case_id}</span>` : ""}${t.synthetic ? '<span class="bdg gy n">sim</span>' : ""}</div><div class="sub" style="margin-top:2px">#${a.id} · ${esc(t.username)} · score ${t.fraud_score} · ${esc((t.fraud_reasons[0] || "No risk factors").slice(0, 90))} · ${fdate(a.created_at)}</div></div><div class="sub" style="text-align:right;white-space:nowrap">${a.assigned_to ? "→ " + esc(a.assigned_to) : '<span class="dim">unassigned</span>'}<br>${slaText(a)}</div><span class="dim" style="cursor:pointer" data-act="alOpen" data-arg="${a.id}">${open ? "▲" : "▼"}</span></div>${open ? alertPanel(a, t) : ""}</div>`;

    )}${done ? "<option selected>resolved</option>" : ""}</select>${done ? `<button class="btn sm" data-act="alReopen" data-arg="${a.id}">Reopen</button>` : `<button class="btn sm grn" data-act="alResolve" data-arg="${a.id}|false_positive">False positive</button><button class="btn sm red" data-act="alResolve" data-arg="${a.id}|confirmed_fraud">Confirm fraud</button>`}</div>

    <div><h3 style="margin-top:0">Investigation notes <span class="dim" style="font-weight:400">(internal, append-only)</span></h3>${a.notes.map((n) => `<div style="background:rgba(0,0,0,.2);border-radius:8px;padding:8px 10px;margin-bottom:6px"><div style="font-size:13px">${esc(n.text)}</div><div class="hint">${esc(n.who)} · ${fdate(n.at)}</div></div>`).join("") || '<p class="hint">No notes yet.</p>'}<div class="row"><input id="n-${a.id}" placeholder="Add a note…"><button class="btn sm" data-act="alNote" data-arg="${a.id}">Add</button></div>
    <h3>Audit trail</h3><div class="tl" style="max-height:150px;overflow:auto">${[
      ...a.audit,

      .reverse()

        (e) =>
          `<div class="e" style="padding-bottom:6px"><span style="font-size:12.5px">${esc(e.what)}</span><div class="hint">${esc(e.who)} · ${fdate(e.at)}</div></div>`,
      )
      .join("")}</div></div></div></div>`;
      }
      function resolveAlert(a, outcome, silent) {
        const t = txnOf(a.transaction_id);
        a.status = "resolved";
        a.outcome = outcome;
        a.resolved_at = Date.now();
        a.resolved_by = S.me.username;
        a.assigned_to = a.assigned_to || S.me.username;
        alertAudit(a, S.me.username, `Resolved — ${outcome.replace("_", " ")}`);
        if (outcome === "confirmed_fraud") {
          CFG.dynBlacklist.devices.add(t.device);
          if (!/^(185\.220|10\.66)/.test(t.ip)) CFG.dynBlacklist.ips.add(t.ip);
          t.truth = true;
        }
        S.audit.unshift({
          id: Date.now() % 100000,
          at: Date.now(),
          user: S.me.username,
          action: "ALERT_RESOLVE",
          entity: "alert",
          detail: `Resolved alert #${a.id} as ${outcome}`,
          ip: "127.0.0.1",

        if (!silent)
          toast(
            outcome === "confirmed_fraud"
              ? `Alert #${a.id} <b>confirmed fraud</b> — device &amp; IP blacklisted`

      }
      Object.assign(ACT, {

        alSel(id) {

          );

      /* ---------------- Disputes ---------------- */

  <div class="card" style="margin-bottom:14px"><h2>Open a Dispute</h2><div class="row">${field(

  <div class="card p0"><div class="hd"><h2>${list.length} dispute${list.length === 1 ? "" : "s"}</h2><select style="width:auto" onchange="UI.disp.f.status=this.value;render()">${opts(

      };

      /* ---------------- Analytics ---------------- */
      V.analytics = () => {
        const T = S.txns,
          days = Array.from({ length: 7 }, (_, i) => {
            const d = new Date(Date.now() - (6 - i) * D);

              (t) => t.created_at >= a && t.created_at < a + D,

              label: d.toLocaleDateString("en-US", {
                month: "short",
                day: "numeric",

              total: x.length,
              fraud: x.filter((t) => t.is_fraud).length,

        const rc = {
          lo: T.filter((t) => t.risk_level === "low").length,

        const loc = {};
        T.filter((t) => t.risk_level !== "low").forEach((t) => {
          loc[t.location] = (loc[t.location] || 0) + 1;
        });
        const ld = Object.entries(loc)
          .map(([label, v]) => ({ label, v }))
          .sort((a, b) => b.v - a.v)
          .slice(0, 8);
        const mer = {};
        T.filter((t) => t.risk_level !== "low").forEach((t) => {
          mer[t.merchant] = (mer[t.merchant] || 0) + 1;
        });
        const md = Object.entries(mer)
          .map(([label, v]) => ({ label, v }))
          .sort((a, b) => b.v - a.v)
          .slice(0, 8);
        return `${heading("chart", "Analytics", "Transaction patterns and fraud insights")}
  <div class="grid g2"><div class="card"><h2>Transaction Volume by Day</h2>${barChart(days, { keys: ["total", "fraud"], colors: [CLR.cy, CLR.hi], names: ["Total", "Fraud"] })}</div><div class="card"><h2>Risk Level Distribution</h2><div style="padding-top:8px">${donut(

  <div class="card" style="margin-top:14px"><h2>Amount by Category</h2>${hbarChart(cd, { color: "#38bdf8", fmt: (v) => "$" + v.toLocaleString(), lw: 100 })}</div>

      /* ---------------- Live feed ---------------- */
      const FEED = {

          const k = pk(["ato", "crypto", "proxy", "burst"]);

            k === "ato"

                  merchant: pk(["Apple Store", "Amazon"]),
                  category: "electronics",
                  location: pk(["Lagos, NG", "Unknown", "Singapore, SG"]),

                  device: "dev-" + hex(8),
                  ip:
                    "185.220." +
                    Math.floor(rA(1, 200)) +
                    "." +
                    Math.floor(rA(2, 250)),

                    category: "crypto",
                    location: u.home,

                    device: "dev-" + hex(8),

                      merchant: "Casino Vegas",
                      category: "gambling",
                      location: u.home,
                      card_type: "prepaid",

            category: null,
            location: u.home,

          .join("") ||
        '<div class="empty">Feed is idle. Press <b>Start</b> to stream synthetic transactions through the real engine.</div>';
      V["live-feed"] =

  <div class="card" style="margin-bottom:14px"><div class="row">${field("Interval (ms)", `<input id="lf-i" type="number" min="300" step="100" value="${FEED.interval}">`, 'fl" style="max-width:160px')}${field("Fraud ratio (%)", `<input id="lf-r" type="range" min="0" max="80" value="${FEED.ratio}" oninput="$('#lf-rv').textContent=this.value">`, 'fl" style="max-width:220px')}<b id="lf-rv" style="align-self:flex-end;padding-bottom:6px">${FEED.ratio}</b><button class="btn ${FEED.running ? "red" : "pri"}" style="align-self:flex-end" data-act="${FEED.running ? "feedStop" : "feedStart"}">${FEED.running ? "Stop" : "Start"} simulation</button><button class="btn" style="align-self:flex-end" data-act="feedClear">Clear</button>
  <div style="margin-left:auto;display:flex;gap:24px"><div><div class="sub">Streamed</div><b id="fc" style="font-size:22px">${FEED.count}</b></div><div><div class="sub">Flagged high</div><b id="ff" style="font-size:22px;color:#f87171">${FEED.fraud}</b></div></div></div></div>
  <div class="card p0"><div class="hd"><h2>Feed</h2><span class="sub">new rows slide in as the engine decides</span></div><div class="feed" id="feed">${feedHtml()}</div></div>`;
      Object.assign(ACT, {

      /* ---------------- Cases ---------------- */

      V.cases = () => {

  <div class="card p0"><div class="hd"><h2>${list.length} case${list.length === 1 ? "" : "s"}</h2><select style="width:auto" onchange="UI.caseF.status=this.value;render()">${opts(Object.entries(CST), f.status, "All statuses")}</select></div><div class="tw"><table><thead><tr><th>Case</th><th>Status</th><th>Priority</th><th>Assignee</th><th>Alerts</th><th>Txns</th><th>Outcome</th><th>Updated</th></tr></thead><tbody>${list.map((c) => `<tr class="clk" onclick="location.hash='#/cases/${c.id}'"><td><b>#${c.id}</b> ${esc(c.title)}</td><td>${statusBdg(c.status)}</td><td><span class="bdg ${c.priority === "high" ? "hi" : "me"}">${c.priority}</span></td><td class="mut">${esc(c.assignee)}</td><td>${c.alerts.length}</td><td>${c.txns.length}</td><td>${c.outcome ? OUT[c.outcome] : '<span class="dim">—</span>'}</td><td class="sub">${ago(c.updated_at)}</td></tr>`).join("")}</tbody></table></div></div>
  <p class="hint" style="margin-top:10px">Cases are created from the Alerts queue by selecting related alerts — here the demo ships four pre-built investigations.</p>`;

  ${

      ? `<div class="card" style="margin-bottom:14px"><div class="row">${field(
          "Status",

        )}${field("Add a note", `<input id="cn-${c.id}" placeholder="Timeline note…">`)}<button class="btn" style="align-self:flex-end" data-act="caseNote" data-arg="${c.id}">Add note</button></div></div>`
      : ""
  }
  <div class="grid g2"><div class="card"><h2>Contents</h2><p class="sub">${c.alerts.length} alerts · ${c.txns.length} transactions · ${money(c.txns.reduce((a, i) => a + txnOf(i).amount, 0))} total</p><div class="tw" style="max-height:260px"><table><tbody>${c.txns
    .slice(0, 14)
    .map((i) => {

    })
    .join("")}</tbody></table></div></div>
  <div class="card"><h2>Linked entities</h2>${[...ents]
    .slice(0, 16)
    .map((e) => `<span class="chip mono">${esc(e)}</span>`)
    .join(
      "",
    )}<h2 style="margin-top:14px">Possibly related alerts</h2>${rel.length ? rel.map((a) => `<div class="row" style="padding:4px 0"><a href="#/transactions/${a.transaction_id}">Alert #${a.id}</a><span class="sub">shares a device or IP</span><button class="btn sm" data-act="caseAdd" data-arg="${c.id}|${a.id}">Add to case</button></div>`).join("") : '<p class="sub">No unlinked open alerts share a device or IP with this case.</p>'}</div></div>
  <div class="card" style="margin-top:14px"><h2>Timeline</h2><div class="tl">${[

    )
    .join("")}</div></div>
  ${c.status !== "closed" ? `<div class="card" style="margin-top:14px"><h2>Close case</h2><div class="row">${field("Outcome", `<select id="co-${c.id}">${opts(Object.entries(OUT), "confirmed_fraud")}</select>`, 'fl" style="max-width:220px')}${field("Closing note (10+ chars)", `<input id="cc-${c.id}">`)}<button class="btn pri" style="align-self:flex-end" data-act="caseClose" data-arg="${c.id}">Close case</button></div></div>` : `<div class="ok-box" style="margin-top:14px">Case closed — ${OUT[c.outcome]}.</div>`}`;
      };
      Object.assign(ACT, {
        caseStatus(id, v) {

        },
      });

      /* ---------------- Relationships ---------------- */
      V.relationships = () => {
        const sel = UI.ring || (UI.ring = 0),
          r = S.rings[sel] || S.rings[0],
          node = UI.relNode;
        return `${heading("net", "Relationships", "Accounts that appear to be operated together. A lead for review, never proof.")}
  <div class="grid g12"><div class="col"><div class="card p0"><div class="hd"><h2>Clusters</h2><span class="sub">${S.rings.length} found</span></div>${S.rings.map((x, i) => `<div class="row clk" style="padding:12px 16px;border-bottom:1px solid var(--line2);cursor:pointer;${i === sel ? "background:rgba(34,211,238,.07)" : ""}" data-act="ringSel" data-arg="${i}"><div style="flex:1"><b>Cluster ${i + 1}</b> ${statusBdg(x.status)}<div class="sub">${x.members.length} accounts · ${x.devices.length} shared device${x.devices.length === 1 ? "" : "s"} · ${x.ips.length} shared IP${x.ips.length === 1 ? "" : "s"}</div><div class="sub">${x.txns} txns · ${money(x.total, 0)} · ${x.flagged} flagged</div></div></div>`).join("")}</div>
    <div class="info">Evidence is weighted: a <b style="color:#fb923c">shared device</b> (strong, orange) counts for more than a <b style="color:#eab308">shared IP</b> (weak, yellow — households and offices share IPs). A confirmed-fraud account in the cluster makes new activity on its devices a hard-rule hit.</div></div>
  <div class="col"><div class="card"><h2>Cluster ${S.rings.indexOf(r) + 1} graph <span class="sub" style="font-weight:400">— identifiers inside, accounts outside</span></h2>${ringGraph(r)}<div class="legend"><span><i style="background:#ef4444"></i>account w/ confirmed fraud</span><span><i style="background:#60a5fa"></i>account</span><span><i style="background:#a78bfa"></i>device</span><span><i style="background:#14b8a6"></i>IP</span></div>
    ${node ? `<div class="note" style="margin-top:10px;background:rgba(96,165,250,.07);border-color:rgba(96,165,250,.3);color:#bfdbfe">${nodeInfo(r, node)}</div>` : '<p class="hint">Click a node to inspect it.</p>'}</div>
    <div class="card"><h2>Signals</h2>${ringSignals(r)}</div>
    <div class="card p0"><div class="hd"><h2>Member accounts</h2></div><div class="tw"><table><thead><tr><th>Account</th><th>Link</th><th>Txns</th><th>Merchants</th><th>Total</th><th>Flagged</th><th>Confirmed fraud</th></tr></thead><tbody>${r.members
      .map((m) => {
        const tx = S.txns.filter((t) => t.user_id === m.id),
          cf = r.confirmed.includes(m),
          viaDev = tx.some((t) => r.devices.includes(t.device));
        return `<tr><td><b>${esc(m.username)}</b></td><td>${viaDev ? '<span class="bdg or n">shared device</span>' : '<span class="bdg me n">shared IP only</span>'}</td><td>${tx.length}</td><td>${new Set(tx.map((t) => t.merchant)).size}</td><td class="num">${money(
          tx.reduce((a, t) => a + t.amount, 0),
          0,
        )}</td><td>${tx.filter((t) => t.risk_level !== "low").length}</td><td>${cf ? '<span class="bdg hi">yes</span>' : '<span class="dim">no</span>'}</td></tr>`;
      })
      .join("")}</tbody></table></div></div></div></div>`;
      };
      function ringLayout(r) {
        const ids = [
            ...r.devices.map((d) => ({ id: "d:" + d, t: "device", label: d })),
            ...r.ips.map((d) => ({ id: "i:" + d, t: "ip", label: d })),
          ],
          accts = r.members.map((m) => ({
            id: "u:" + m.id,
            t: "acct",
            label: m.username,
            m,
          })),
          pos = {},
          cx = 320,
          cy = 250;
        ids.forEach((n, i) => {
          const a = (i / ids.length) * Math.PI * 2 - Math.PI / 2,
            rad = ids.length === 1 ? 0 : 70;
          pos[n.id] = [cx + rad * Math.cos(a), cy + rad * Math.sin(a)];
        });
        accts.forEach((n, i) => {
          const a = (i / accts.length) * Math.PI * 2 - Math.PI / 2;
          pos[n.id] = [cx + 185 * Math.cos(a), cy + 175 * Math.sin(a)];
        });
        return { nodes: [...ids, ...accts], pos };
      }
      function ringGraph(r) {
        const { nodes, pos } = ringLayout(r),
          edges = new Set();
        S.txns.forEach((t) => {
          if (r.members.some((m) => m.id === t.user_id)) {
            if (r.devices.includes(t.device))
              edges.add(`u:${t.user_id}|d:${t.device}`);
            if (r.ips.includes(t.ip)) edges.add(`u:${t.user_id}|i:${t.ip}`);
          }
        });
        let s = `<svg viewBox="0 0 640 500" width="100%" style="max-width:660px;display:block;margin:0 auto;background:rgba(0,0,0,.18);border-radius:10px">`;
        edges.forEach((e) => {
          const [a, b] = e.split("|"),
            strong = b.startsWith("d:");
          if (!pos[a] || !pos[b]) return;
          s += `<line x1="${pos[a][0]}" y1="${pos[a][1]}" x2="${pos[b][0]}" y2="${pos[b][1]}" stroke="${strong ? "#f97316" : "#eab308"}" stroke-width="${strong ? 2.6 : 1.4}" ${strong ? "" : 'stroke-dasharray="4 3"'} opacity=".8"/>`;
        });
        nodes.forEach((n) => {
          const [x, y] = pos[n.id],
            on = UI.relNode === n.id;
          s += `<g style="cursor:pointer" data-act="relNode" data-arg="${n.id}">`;

            const cf = r.confirmed.includes(n.m);
            s += `<circle cx="${x}" cy="${y}" r="${on ? 20 : 17}" fill="${cf ? "#ef4444" : "#60a5fa"}" fill-opacity=".85" stroke="${on ? "#fff" : "none"}" stroke-width="2"/><text x="${x}" y="${y + 33}" text-anchor="middle" font-size="11" fill="#d1d5db">${esc(n.label)}</text>`;
          } else if (n.t === "device")
            s += `<rect x="${x - 15}" y="${y - 15}" width="30" height="30" rx="6" fill="#a78bfa" stroke="${on ? "#fff" : "none"}" stroke-width="2"/><text x="${x}" y="${y + 29}" text-anchor="middle" font-size="9" fill="#c4b5fd">${esc(n.label)}</text>`;
          else
            s += `<path d="M${x} ${y - 17}L${x + 17} ${y}L${x} ${y + 17}L${x - 17} ${y}Z" fill="#14b8a6" stroke="${on ? "#fff" : "none"}" stroke-width="2"/><text x="${x}" y="${y + 31}" text-anchor="middle" font-size="9" fill="#5eead4">${esc(n.label)}</text>`;
          s += "</g>";
        });
        return s + "</svg>";
      }
      function nodeInfo(r, id) {
        if (id.startsWith("u:")) {
          const m = S.users.find((u) => u.id === +id.slice(2)),
            tx = S.txns.filter((t) => t.user_id === m.id);

            tx.reduce((a, t) => a + t.amount, 0),

        }
        const key = id.slice(2),
          tx = S.txns.filter((t) => t.device === key || t.ip === key),
          us = new Set(tx.map((t) => t.username));
        return `<b class="mono">${esc(key)}</b> — seen on ${us.size} accounts (${[...us].map(esc).join(", ")}) across ${tx.length} transactions.`;
      }
      function ringSignals(r) {
        const tx = S.txns
          .filter(
            (t) =>
              r.members.some((m) => m.id === t.user_id) &&
              (r.devices.includes(t.device) || r.ips.includes(t.ip)),
          )
          .sort((a, b) => a.created_at - b.created_at);
        let best = null;
        for (let i = 0; i < tx.length; i++) {
          const w = tx.filter(
            (t) =>
              t.created_at >= tx[i].created_at &&
              t.created_at < tx[i].created_at + 12 * H,
          );
          if (!best || w.length > best.n)
            best = {
              n: w.length,
              a: new Set(w.map((t) => t.user_id)).size,
              at: tx[i].created_at,
            };
        }
        return `<ul class="reasons" style="margin:0"><li><b style="color:#fb923c">Shared device:</b> ${r.devices.length ? r.devices.map((d) => `<span class="mono">${d}</span>`).join(", ") + ` used by ${new Set(S.txns.filter((t) => r.devices.includes(t.device)).map((t) => t.user_id)).size} accounts` : "none"}</li><li><b style="color:#eab308">Shared IP:</b> ${r.ips.map((d) => `<span class="mono">${d}</span>`).join(", ") || "none"}</li>${best && best.a > 1 ? `<li><b style="color:#fdba74">Burst:</b> ${best.n} transactions from ${best.a} accounts within 12 hours starting ${fdate(best.at)}</li>` : ""}<li><b>Network risk effect:</b> ${r.status === "confirmed" ? "a confirmed-fraud account is in this cluster, so new activity from it is a <b>hard-rule override</b>" : "no confirmed fraud yet — new activity gets a <b>+25 watch bump</b>, not an override"}</li></ul>`;
      }
      Object.assign(ACT, {
        ringSel(i) {
          UI.ring = +i;
          UI.relNode = null;

          dv = new Set(tx.map((t) => t.device)).size;

      /* ---------------- Model performance & health ---------------- */
      function perf() {

          (t) =>

            .sort((a, b) => b.s - a.s),

          ap = 0;
        lab.forEach((x, i) => {

            ap += tp / (i + 1);

          reviewed: rev.length,
          conf,
          fp,
          missed,
          presumed,
          precision: rev.length ? conf / rev.length : null,
          precision_ci: wilson(conf, rev.length),
          recall: conf + missed ? conf / (conf + missed) : null,
          recall_ci: wilson(conf, conf + missed),
          fpr: fp + presumed ? fp / (fp + presumed) : null,
          fpr_ci: wilson(fp, fp + presumed),
          prauc: P ? ap / P : null,
          base: lab.length ? P / lab.length : null,
          flagged: al.length,
          unreviewed: al.length - rev.length,
        };

            b = now - w * 7 * D,
            d = new Date(b),
            x =
              (d.getMonth() + 1).toString().padStart(2, "0") +
              "-" +
              d.getDate().toString().padStart(2, "0");

                (q) => q.outcome && q.created_at >= a && q.created_at < b,
              ),
              c = rv.filter((q) => q.outcome === "confirmed_fraud").length;
            out.push({
              x,
              precision: rv.length ? c / rv.length : null,
              recall: rv.length ? Math.min(0.95, c / (c + 2)) : null,
              reviewed: rv.length,
              low: rv.length < 20,
            });

            out.push({
              x,
              precision: 0.66 + r() * 0.16 + (9 - w) * 0.004,
              recall: 0.68 + r() * 0.14,
              reviewed: n,
              low: n < 38,
            });
          }
        }
        return out;
      }

              f = t.features || {},

                (f.distance > 2000 ? 0.35 : 0) +
                (f.ratio > 6 ? 0.3 : 0) -
                (f.ratio < 1.5 && !f.new_device ? 0.25 : 0),
              s4 = +(sigmoid(lg + d) * 100).toFixed(1);

          ),
          edges = [0, 20, 35, 55, 80, 101];
        const bands = edges.slice(0, -1).map((lo, i) => {
          const x = ml.filter((a) => {
              const s = txnOf(a.transaction_id).fraud_score;
              return s >= lo && s < edges[i + 1];
            }),
            c = x.filter((a) => a.outcome === "confirmed_fraud").length,
            pred = x.length
              ? x.reduce((q, a) => q + txnOf(a.transaction_id).fraud_score, 0) /
                x.length
              : null,
            w = wilson(c, x.length);
          return {
            b: `${lo}–${Math.min(100, edges[i + 1] - 1)}`,
            n: x.length,
            pred,
            obs: x.length ? c / x.length : null,
            w,

    .map((b) => {

  <div class="card" style="margin-top:14px"><h2>API keys</h2>${keysHtml()}</div><div class="card" style="margin-top:14px"><h2>Webhooks</h2>${hooksHtml()}</div>

      };
      function fakeQr() {
        const r = mulberry32(9);
        let s = `<svg width="132" height="132" viewBox="0 0 33 33" style="background:#fff;border-radius:8px;padding:4px">`;
        for (let y = 0; y < 33; y++)
          for (let x = 0; x < 33; x++) {
            const f =
              (x < 8 && y < 8) || (x > 24 && y < 8) || (x < 8 && y > 24);
            if (
              f
                ? x % 24 === 0 ||
                  x % 24 === 6 ||
                  y % 24 === 0 ||
                  y % 24 === 6 ||
                  (x % 24 >= 2 && x % 24 <= 4 && y % 24 >= 2 && y % 24 <= 4)
                : r() > 0.52
            )
              s += `<rect x="${x}" y="${y}" width="1" height="1" fill="#000"/>`;
          }
        return s + "</svg>";

            ["bulk", "Bulk Import", "upload"],
          ],
        ],
        [
          "Investigate",
          [
            ["disputes", "Disputes", "scale"],
            ["cases", "Cases", "folder", 1],
            ["relationships", "Relationships", "net", 1],
            ["profiles", "Profiles", "user", 1],
          ],
        ],
        [
          "Govern",
          [
            ["feedback", "Feedback", "check", 1],
            ["verification", "Verification", "lock", 1],
            ["rule-lab", "Rule Lab", "flask", 1],
            ["model-performance", "Model", "line", 1],
            ["admin", "Admin", "cog", 1],
          ],
        ],
        ["Account", [["settings", "Settings", "user"]]],
      ];
      const ADMIN_ONLY = new Set(
        NAV.flatMap((g) => g[1])
          .filter((n) => n[3])
          .map((n) => n[0]),
      );
      function route() {
        const p = (location.hash || "#/dashboard")
          .replace(/^#\/?/, "")
          .split("/");
        return { name: p[0] || "dashboard", id: p[1] };
      }

      function render() {
        const root = $("#root");
        if (!S.me) {
          root.innerHTML = loginHtml();
          return;
        }
        const r = route();
        let name = r.name;
        if (ADMIN_ONLY.has(name) && !isAdmin()) {
          toast("That page is admin-only — switch role to Admin", "warn");
          location.hash = "#/dashboard";
          return;
        }
        let body;
        try {
          body =
            name === "transactions" && r.id
              ? V.txnDetail(r.id)
              : name === "cases" && r.id
                ? V.caseDetail(r.id)
                : V[name]
                  ? V[name]()
                  : V.dashboard();
        } catch (e) {
          console.error(e);
          body = `<div class="err-box"><b>This view crashed:</b> ${esc(e.message)}</div>`;
        }
        const y = window.scrollY,
          same = shell.last === location.hash;
        if (!$("#side")) {
          root.innerHTML = shellHtml();
        }
        $("#page").innerHTML = `<div class="pg">${body}</div>`;
        $("#side").innerHTML = sideHtml(name);
        $("#top-role").innerHTML = roleHtml();
        refreshBell();
        if (same) window.scrollTo(0, y);
        else window.scrollTo(0, 0);
        shell.last = location.hash;
      }
      const shell = { last: "" };
      function shellHtml() {
        return `<div id="app"><aside id="side"></aside><div id="main"><div class="banner"><b>DEMO MODE</b> All data is synthetic and runs entirely in your browser — nothing is sent anywhere. Every control works: try the Simulator, resolve an alert, edit a rule, then re-score.<span style="margin-left:auto"><a onclick="ACT.reset()">Reset demo data</a></span></div>
  <div id="top"><button class="btn sm" id="menu" onclick="$('#side').classList.toggle('open')">${ico("menu", 16)}</button><span id="top-role"></span><span class="sp"></span><span class="pill ${CFG.mlDown ? "" : "live"}" id="mlpill" style="cursor:pointer" onclick="ACT.mlDown(!CFG.mlDown)" title="Click to simulate an ML outage"><i class="dot" style="color:${CFG.mlDown ? "#f87171" : ""}"></i>ML service ${CFG.mlDown ? "down" : "ok"}</span><div style="position:relative"><button class="btn sm" id="bell" onclick="ACT.bell()">${ico("bell", 16)}<span id="bellc" class="bdg hi" style="display:none"></span></button><div id="belld" class="card" style="display:none;position:absolute;right:0;top:38px;width:320px;z-index:30;padding:8px"></div></div><button class="btn sm" onclick="ACT.logout()">${ico("out", 14)} Sign out</button></div><div id="page"></div></div></div>`;
      }
      function sideHtml(cur) {
        const c = S.alerts.filter((a) => a.status !== "resolved").length;
        return `<div class="brand"><i>${ico("shield", 17)}</i>FraudGuard</div>${NAV.map(
          ([g, items]) => {
            const vis = items.filter((n) => !n[3] || isAdmin());
            return vis.length
              ? `<div class="navg">${g}</div>${vis.map(([k, l, i]) => `<button class="nav ${cur === k || (cur === "cases" && k === "cases") ? "on" : ""}" onclick="location.hash='#/${k}';$('#side').classList.remove('open')">${ico(i, 15)}${l}${k === "alerts" && c ? `<span class="bd">${c}</span>` : ""}</button>`).join("")}`
              : "";
          },
        ).join("")}`;
      }
      function roleHtml() {
        return `<span class="pill">${ico("user", 13)} ${esc(S.me.username)}</span><select style="width:auto;padding:4px 8px;font-size:12px" onchange="ACT.role(this.value)" title="Switch role to see RBAC in action"><option value="admin" ${isAdmin() ? "selected" : ""}>role: admin</option><option value="analyst" ${!isAdmin() ? "selected" : ""}>role: analyst</option></select>`;
      }
      function loginHtml() {
        return `<div class="login"><div class="box"><div class="brand" style="justify-content:center;font-size:22px;padding-bottom:6px"><i style="width:42px;height:42px">${ico("shield", 24)}</i>FraudGuard</div><p class="sub" style="text-align:center;margin:0 0 18px">AI-powered fraud detection · interactive demo</p>
  <div class="card"><h2 style="font-size:18px">Sign in</h2><div class="col">${field("Username", '<input id="lg-u" value="admin">', "")}${field("Password", '<input id="lg-p" type="password" value="demo-password">', "")}<button class="btn pri" style="justify-content:center" data-act="login" data-arg="admin">Sign in as Admin</button><button class="btn" style="justify-content:center" data-act="login" data-arg="analyst">Sign in as Analyst</button><div class="row" style="justify-content:space-between"><a onclick="toast('Demo: a reset email would be logged to the console','')">Forgot password?</a><span class="hint">Auth0-style JWT + refresh tokens + TOTP in the real app</span></div></div></div>
  <p class="hint" style="text-align:center;margin-top:14px">Admins see Cases, Relationships, Profiles, Feedback, Verification, Rule Lab, Model and Admin. Analysts don't — role-based access control.</p></div></div>`;
      }
      let bellOpen = false;
      function refreshBell() {
        const c = $("#bellc");
        if (!c) return;
        c.style.display = UI.notifs.length ? "inline-flex" : "none";
        c.textContent = Math.min(UI.notifs.length, 99);
        c.style.position = "absolute";
        c.style.top = "-6px";
        c.style.right = "-6px";
        const d = $("#belld");
        if (d)
          d.innerHTML =
            `<div class="row" style="justify-content:space-between;padding:4px 8px"><b>Notifications</b><a onclick="UI.notifs=[];refreshBell()">clear</a></div>` +
            (UI.notifs
              .slice(0, 8)
              .map(
                (n) =>
                  `<div style="padding:8px;border-top:1px solid var(--line2);cursor:pointer" onclick="location.hash='#/transactions/${n.txn}';ACT.bell()"><span class="bdg hi">high</span> ${esc(n.text)}<div class="hint">${ago(n.at)}</div></div>`,
              )
              .join("") ||
              '<div class="hint" style="padding:12px">No new high-risk alerts.</div>');
        const p = $("#mlpill");
        if (p) {
          p.className = "pill " + (CFG.mlDown ? "" : "live");
          p.innerHTML = `<i class="dot" style="color:${CFG.mlDown ? "#f87171" : ""}"></i>ML service ${CFG.mlDown ? "down" : "ok"}`;
        }
      }
      Object.assign(ACT, {
        bell() {
          bellOpen = !bellOpen;
          $("#belld").style.display = bellOpen ? "block" : "none";
        },
        login(kind) {
          const a = kind === "analyst";
          S.me = Object.assign({}, S.staff[a ? 1 : 0]);
          location.hash = "#/dashboard";
          shell.last = "";
          render();
          toast(`Signed in as <b>${S.me.username}</b> (${S.me.role})`, "ok");
        },
        logout() {
          S.me = null;
          FEED.running = false;
          clearInterval(FEED.timer);
          $("#root").innerHTML = loginHtml();
        },
        role(v) {
          S.me.role = v;
          S.me.username = v === "admin" ? "admin" : "sara.analyst";
          if (v !== "admin" && ADMIN_ONLY.has(route().name))
            location.hash = "#/dashboard";
          render();
          toast(`Now acting as <b>${v}</b>`, "");
        },
        reset() {
          FEED.running = false;
          clearInterval(FEED.timer);
          Object.assign(FEED, { events: [], count: 0, fraud: 0 });
          Object.assign(S, {
            txns: [],
            alerts: [],
            cases: [],
            disputes: [],
            labels: [],
            users: [],
            staff: [],
            audit: [],
            rings: [],
            models: [],
            proposals: [],
            modelChanges: [],
            datasets: [],
            runs: [],
            apiKeys: [],
            webhooks: [],
            deliveries: [],
            nextTxn: 1001,
            nextAlert: 501,
            nextCase: 31,
          });
          CFG.dynBlacklist = { devices: new Set(), ips: new Set() };
          Object.assign(CFG, {
            rules: {
              blacklistedMerchants: [
                "DarkNet Market",
                "FastCash Wire Instant",
                "QuickCoin Anonymous",
              ],
              blacklistedLocations: ["Anonymous Proxy"],
              blacklistedDevices: [],
              blacklistedIps: [],
              absoluteAmountCap: 10000,
              version: 4,
            },
            policy: {
              version: 3,
              medium_threshold: 20,
              high_threshold: 55,
              review_capacity_per_day: 25,
              note: "Raised review threshold after Q3 false-positive audit",
              created_by: "admin",
              created_at: NOW0 - 9 * D,
            },
            verification: {
              version: 2,
              mode: "enforce",
              actions: { low: "approve", medium: "challenge", high: "decline" },
              min_amount: 50,
              ttl_seconds: 300,
              note: "",
              created_by: "admin",
              created_at: NOW0 - 6 * D,
            },
            mlDown: false,
            activeModel: "v3",
          });
          UI.notifs = [];
          UI.sim = UI.bulk = UI.lab = UI.vform = UI.pform = null;
          initData();
          S.me = Object.assign({}, S.staff[0]);
          render();
          toast("Demo data reset", "ok");
        },
      });
      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-act]");
        if (el && ACT[el.dataset.act]) {
          if (e.target.closest("input,select,textarea") && el !== e.target)
            return;
          ACT[el.dataset.act](el.dataset.arg);
        }
        if (bellOpen && !e.target.closest("#belld,#bell")) {
          bellOpen = false;
          const d = $("#belld");
          if (d) d.style.display = "none";
        }
      });
      window.addEventListener("hashchange", () => {
        UI.rescore = null;
        render();
      });
      S.me = null;
      render();
    </script>
  </body>
</html>
