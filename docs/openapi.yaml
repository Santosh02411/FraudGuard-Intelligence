openapi: 3.0.3
info:
  title: FraudGuard API
  version: "1.0.0"
  description: |
    REST API for FraudGuard — a hybrid rules + ML transaction fraud-detection
    system. Every `POST /transactions` call runs the submitted transaction
    through the real hybrid engine (hard rules → ML model → rule-engine
    fallback) and returns a `risk_level`, `fraud_score`, human-readable
    `fraud_reasons`, and — when the ML model scored it — a SHAP-based
    `shap_explanation` showing which features drove the score.

    See `docs/METHODOLOGY.md` for how detection works and the trade-offs
    behind it, and the main `README.md` for an architecture diagram and
    setup instructions.

    **Versioning:** all routes are served under `/api/v1`. The unversioned
    `/api/*` paths shown here also work today (mounted as an alias to the
    same v1 routes) but new integrations should target `/api/v1` — see
    the `servers` list below.
  contact:
    name: FraudGuard
  license:
    name: UNLICENSED

servers:
  - url: http://localhost:5000/api/v1
    description: Local development (versioned — preferred)
  - url: http://localhost:5000/api
    description: Local development (unversioned alias)

tags:
  - name: Cognee memory
    description: Optional AI Memory / Fraud Intelligence (admin only) - historical search, entity graph, sync, investigation assistant
  - name: Auth
    description: Registration, login, token refresh/rotation, logout
  - name: Transactions
    description: Submit and list transactions; the core fraud-scoring endpoint
  - name: Alerts
    description: View and resolve medium/high-risk transaction alerts
  - name: Admin
    description: User management, system stats, the live-feed simulation, and the audit trail (admin role required)
  - name: API Keys
    description: Self-service service-to-service credentials for the Transactions endpoints
  - name: Webhooks
    description: Self-service outbound webhook registration and delivery logs
  - name: Disputes
    description: |
      Chargeback/dispute case tracking (feature: case management /
      compliance). Distinct from an alert's `verdict` — a dispute
      tracks what actually happened financially with the card network
      once a charge was formally contested, which can diverge from
      FraudGuard's own fraud call. See `models/disputeRepository.js`.
  - name: System
    description: Health check

security:
  - bearerAuth: []

paths:
  /customer-profiles:
    get: { summary: Ranked, explainable customer risk profiles (admin; analyst aid only), responses: { "200": { description: OK } } }
  /customer-profiles/{id}:
    get: { summary: One account's profile with per-component evidence (audited), responses: { "200": { description: OK }, "404": { description: Not found } } }
  /feedback/labels:
    get: { summary: List feedback labels, responses: { "200": { description: OK } } }
    post: { summary: Propose a fraud/legitimate label, responses: { "201": { description: Created }, "409": { description: ALREADY_LABELLED }, "422": { description: SYNTHETIC } } }
  /feedback/labels/import-outcomes:
    post: { summary: Propose labels from existing analyst verdicts (still need verification), responses: { "200": { description: OK } } }
  /feedback/labels/{id}/verify:
    post: { summary: Verify a label (a different investigator), responses: { "200": { description: OK }, "409": { description: SELF_VERIFICATION or NOT_PENDING } } }
  /feedback/labels/{id}/reject:
    post: { summary: Reject a proposed label, responses: { "200": { description: OK } } }
  /feedback/labels/{id}/withdraw:
    post: { summary: Withdraw a proposed or verified label, responses: { "200": { description: OK } } }
  /feedback/retraining/readiness:
    get: { summary: Verified label counts and what is missing, responses: { "200": { description: OK } } }
  /feedback/retraining/datasets:
    get: { summary: Frozen datasets, responses: { "200": { description: OK } } }
    post: { summary: Build an immutable hashed dataset from verified labels, responses: { "201": { description: Created }, "422": { description: NOT_ENOUGH_LABELS or DATASET_TOO_SMALL } } }
  /feedback/retraining/datasets/{id}/download:
    get: { summary: Download the dataset CSV (audited; X-Content-SHA256 header), responses: { "200": { description: CSV } } }
  /feedback/retraining/runs:
    get: { summary: Retraining runs, responses: { "200": { description: OK } } }
    post: { summary: Request a run (one open run at a time), responses: { "201": { description: Created }, "409": { description: RUN_IN_PROGRESS } } }
  /feedback/retraining/runs/{id}:
    get: { summary: Run status (refreshes from the ML service); candidate_ready is NOT serving, responses: { "200": { description: OK } } }
  /feedback/retraining/runs/{id}/approve:
    post: { summary: Approve a run (a different administrator), responses: { "200": { description: OK }, "409": { description: SELF_APPROVAL } } }
  /feedback/retraining/runs/{id}/reject:
    post: { summary: Reject a pending run, responses: { "200": { description: OK } } }
  /feedback/retraining/runs/{id}/cancel:
    post: { summary: Cancel a pending or approved run, responses: { "200": { description: OK } } }
  /feedback/retraining/runs/{id}/start:
    post: { summary: Start an approved run; trains a candidate only, responses: { "202": { description: Accepted } } }
  /rule-proposals:
    get: { summary: List rule/policy proposals (admin), responses: { "200": { description: OK } } }
    post: { summary: Create a draft proposal, responses: { "201": { description: Created } } }
  /rule-proposals/{id}/simulate:
    post: { summary: Replay history through current vs proposed rules, responses: { "200": { description: Simulation report } } }
  /rule-proposals/{id}/approve:
    post: { summary: Approve (needs fresh simulation and a second admin), responses: { "200": { description: OK }, "409": { description: STALE_SIMULATION or SELF_APPROVAL } } }
  /rule-proposals/{id}/reject:
    post: { summary: Reject, responses: { "200": { description: OK } } }
  /rule-proposals/{id}/activate:
    post: { summary: Apply atomically, responses: { "200": { description: OK }, "409": { description: STALE_BASE } } }
  /rule-proposals/{id}/rollback:
    post: { summary: Roll back an active proposal, responses: { "200": { description: OK }, "409": { description: ROLLBACK_CONFLICT } } }
  /verification/policy:
    get: { summary: Active verification policy, responses: { "200": { description: OK } } }
    put: { summary: Set policy (enforce needs confirm_enforce), responses: { "200": { description: OK } } }
  /verification/policy/preview:
    post: { summary: Preview a policy against recent traffic, responses: { "200": { description: OK } } }
  /verification/effectiveness:
    get: { summary: Challenge outcomes, friction and loss measures (observational), responses: { "200": { description: OK } } }
  /verification/challenges:
    get: { summary: Recent challenges, responses: { "200": { description: OK } } }
  /verification/sweep:
    post: { summary: Expire overdue challenges now, responses: { "200": { description: OK } } }
  /model-monitoring/overview:
    get: { summary: Health overview, responses: { "200": { description: OK } } }
  /model-monitoring/operations:
    get: { summary: Latency, failures, fallback and missing-feature rates, responses: { "200": { description: OK } } }
  /model-monitoring/snapshots:
    get: { summary: Persisted drift/quality snapshots, responses: { "200": { description: OK } } }
  /model-monitoring/segments:
    get: { summary: Drift by segment, responses: { "200": { description: OK } } }
  /model-monitoring/alerts:
    get: { summary: Open monitoring alerts, responses: { "200": { description: OK } } }
  /model-monitoring/alerts/{id}/acknowledge:
    post: { summary: Acknowledge an alert, responses: { "200": { description: OK } } }
  /model-monitoring/run:
    post: { summary: Run the monitor now, responses: { "200": { description: OK } } }
  /model-monitoring/settings:
    get: { summary: Thresholds, responses: { "200": { description: OK } } }
    put: { summary: Update thresholds, responses: { "200": { description: OK } } }
  /health:
    get:
      tags: [System]
      summary: Health check
      description: No authentication required. Reports which API version is running.
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  env: { type: string, example: development }
                  api_version: { type: string, example: v1 }
                  time: { type: string, format: date-time }

  /auth/register:
    post:
      tags: [Auth]
      summary: Create a new user account
      description: |
        Password must be at least 8 characters and include an uppercase
        letter, a lowercase letter, a number, and a symbol — every failing
        rule is reported at once, not just the first.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              username: jane_doe
              email: jane@example.com
              password: "Str0ng!Pass"
      responses:
        "201":
          description: Account created; returns a token pair immediately (no separate login needed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "400":
          description: Validation failed (e.g. weak password)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "409":
          description: Username or email already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: |
        Returns an access token (short-lived JWT, default 15m) and a
        refresh token (long-lived, rotating) — unless the account has
        TOTP 2FA enabled, in which case a correct password returns
        `{ mfaRequired: true, mfaToken }` instead, and the caller must
        complete `POST /auth/login/mfa` to actually get a session. After
        5 consecutive failed password attempts the account is locked for
        15 minutes and this returns `423 Locked` for both correct and
        incorrect passwords, so a locked-out caller learns nothing new
        about which one was wrong.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: admin
              password: admin123
      responses:
        "200":
          description: Login successful, or an MFA challenge if the account has 2FA enabled
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TokenPairResponse"
                  - $ref: "#/components/schemas/MfaChallengeResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: Account temporarily locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/login/mfa:
    post:
      tags: [Auth]
      summary: Complete login with a TOTP or backup code
      description: |
        Completes the two-step login flow started by `POST /auth/login`
        when an account has 2FA enabled. `code` may be a 6-digit TOTP
        code from an authenticator app, or one of the account's
        single-use backup codes (consumed on success — see
        `POST /auth/mfa/enable`). `mfaToken` is short-lived (default 5m)
        and single-purpose — it cannot be used as a real access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaLoginRequest"
      responses:
        "200":
          description: Login completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "401":
          description: Invalid/expired MFA challenge token, or invalid code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new token pair
      description: |
        Rotates on every use — the presented refresh token is revoked and
        a new one issued. Presenting an already-used (revoked) refresh
        token is treated as a possible theft/replay: every active refresh
        token for that account is revoked, not just the reused one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "401":
          description: Invalid, expired, or reused (revoked) refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token server-side
      description: Idempotent and always returns 200 — never reveals whether the token it was given was valid.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Logged out }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Auth]
      summary: Delete (anonymize) your own account
      description: |
        Requires the current password. **Anonymizes rather than
        hard-deletes**: username/email/password are scrambled to an
        unguessable placeholder (freeing the originals for a future
        registration), every refresh token/API key/webhook tied to the
        account is revoked, and the account is excluded from every
        future lookup — including one made with an access token issued
        seconds before this call, which stops working on its very next
        request. Transactions and alerts are deliberately retained
        (not deleted or reassigned), since the app's own dynamic fraud
        blacklist and audit trail depend on that history surviving
        account closure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "401":
          description: Password is incorrect (or not authenticated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      description: |
        Always returns the same generic message whether or not the
        email belongs to an account, so this endpoint can't be used to
        enumerate registered users. Only actually sends an email
        (`services/emailService.js`) when the account exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Generic confirmation message (sent regardless of whether the account exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "If an account with that email exists, a password reset link has been sent." }
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Complete a password reset
      description: |
        `token` is the raw (unhashed) value from the emailed reset
        link — only its SHA-256 hash is ever stored server-side.
        Revokes every refresh token for the account on success, the
        same reasoning as `PATCH /auth/password` below: resetting a
        password means someone just regained control of the account,
        so every other session (including a possible attacker's) should
        have to re-authenticate.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password:
                  type: string
                  minLength: 8
                  description: Must include an uppercase letter, a lowercase letter, a number, and a symbol.
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Password reset successfully. Please log in with your new password." }
        "400":
          description: Invalid/expired token, or weak password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify an email address
      description: |
        Public — the token itself (from the emailed verification link)
        is the credential, so no `Authorization` header is required.
        Verification is **not** required to use the app; this just
        marks `email_verified: true`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Email verified successfully. }
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend the email verification link
      description: Requires being logged in — avoids the enumeration/spam surface of accepting an arbitrary email address in the request body.
      responses:
        "200":
          description: A fresh verification email was sent (or a no-op message if already verified)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/password:
    patch:
      tags: [Auth]
      summary: Change your own password
      description: |
        Requires the current password — an active access token alone
        isn't sufficient to change a credential, the same reasoning as
        `POST /auth/mfa/disable` below. Revokes every other refresh
        token and re-issues a fresh pair for *this* session (so you
        aren't logged out by your own change).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword:
                  type: string
                  minLength: 8
                  description: Must include an uppercase letter, a lowercase letter, a number, and a symbol.
      responses:
        "200":
          description: Password changed — a fresh token pair for this session
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      message: { type: string, example: Password changed successfully. }
                  - $ref: "#/components/schemas/TokenPairResponse"
        "400":
          description: Weak new password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Current password is incorrect (or not authenticated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/email:
    patch:
      tags: [Auth]
      summary: Change your own email address
      description: |
        Requires the current password. Resets `email_verified` back to
        `false` and sends a fresh verification email to the new
        address — an email change has to be re-proven the same as at
        registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newEmail, currentPassword]
              properties:
                newEmail: { type: string, format: email }
                currentPassword: { type: string }
      responses:
        "200":
          description: Email updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Current password is incorrect (or not authenticated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use by another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/mfa/setup:
    post:
      tags: [Auth]
      summary: Start TOTP 2FA setup
      description: |
        Generates a new secret and stores it as *pending* — 2FA isn't
        actually required at login until `POST /auth/mfa/enable`
        confirms it with a valid code. Returns the secret in plaintext
        exactly once (for manual entry as a fallback) plus a QR code
        for the frontend to render.
      responses:
        "200":
          description: Secret + QR code for enrollment
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, example: JBSWY3DPEHPK3PXP }
                  otpauthUrl: { type: string, example: "otpauth://totp/FraudGuard:admin?secret=JBSWY3DPEHPK3PXP&issuer=FraudGuard" }
                  qrCodeDataUrl: { type: string, description: "base64 PNG data URL", example: "data:image/png;base64,..." }
        "400":
          description: 2FA is already enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/mfa/enable:
    post:
      tags: [Auth]
      summary: Confirm 2FA setup and turn it on
      description: |
        Requires one valid 6-digit code from the authenticator app —
        proves the secret from `POST /auth/mfa/setup` was actually
        scanned/entered correctly before 2FA becomes mandatory at
        login. Returns 8 single-use backup codes in plaintext exactly
        once (only bcrypt hashes are persisted). Revokes every refresh
        token for the account (forcing every other session to
        re-authenticate with MFA now required) and immediately
        re-issues a fresh pair for *this* session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^\\d{6}$", example: "123456" }
      responses:
        "200":
          description: 2FA enabled — backup codes + a fresh token pair for this session
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      message: { type: string }
                      backupCodes:
                        type: array
                        items: { type: string }
                        example: ["a1b2-c3d4e5", "f6a7-b8c9d0"]
                      warning: { type: string }
                  - $ref: "#/components/schemas/TokenPairResponse"
        "400":
          description: Invalid code, already enabled, or setup not started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/mfa/disable:
    post:
      tags: [Auth]
      summary: Disable 2FA
      description: Requires the current password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: 2FA disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400":
          description: 2FA is not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Password is incorrect (or not authenticated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me/export:
    get:
      tags: [Auth]
      summary: Download a JSON bundle of everything held about your account
      description: |
        Profile, transactions, alerts, your own audit-trail entries, and
        API key/webhook metadata (never secrets or hashes) — each
        section capped at 10,000 rows so one request can't pull an
        unbounded amount of data.
      responses:
        "200":
          description: Data export bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  exported_at: { type: string, format: date-time }
                  profile:
                    $ref: "#/components/schemas/User"
                  transactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Alert"
                  audit_log_entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLogEntry"
                  api_keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
                  webhooks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Webhook"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /transactions:
    get:
      tags: [Transactions]
      summary: List/search transactions (paginated, filterable)
      description: |
        Regular users see only their own transactions; admins see every
        user's. All filter params are optional and combinable — this is
        the "ops tool" search behind the Transactions history page.
        Accepts either a JWT bearer token or an API key
        (`X-API-Key` — see "API Keys" below); a key needs the
        `transactions:read` scope.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: merchant
          in: query
          description: Case-insensitive partial match.
          schema: { type: string }
        - name: category
          in: query
          schema:
            type: string
            enum: [grocery, food, electronics, travel, entertainment, utilities, clothing, health, crypto, gambling, wire_transfer]
        - name: riskLevel
          in: query
          schema: { type: string, enum: [low, medium, high] }
        - name: dateFrom
          in: query
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          schema: { type: string, format: date-time }
        - name: amountMin
          in: query
          schema: { type: number }
        - name: amountMax
          in: query
          schema: { type: number }
      responses:
        "200":
          description: A page of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          description: Invalid filter value (e.g. unrecognized category)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: API key is missing the transactions:read scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Transactions]
      summary: Submit a transaction and score it for fraud
      description: |
        Runs the transaction through the hybrid fraud engine
        (`analyzeTransactionHybrid`): hard rules first (can force
        `risk_level: "high"` regardless of the model), then the ML
        service (with SHAP explanation), falling back to the deterministic
        rule engine only if the ML service is unreachable. If the result
        is medium or high risk, an alert is created automatically
        (pushed over WebSocket as `alert:new`) and any of the caller's
        active webhooks subscribed to `transaction.flagged` are fired
        (fire-and-forget — see "Webhooks" below).

        Feature: step-up authentication. If the result is medium risk
        AND the caller has a webhook subscribed to
        `transaction.step_up_required` (or `*`), the transaction is
        held (`status: "pending_step_up"`) instead of completing, and
        the response's `step_up` field carries a challenge to resolve
        via `POST /transactions/{id}/step-up/verify`.

        Accepts either a JWT bearer token or an API key (`X-API-Key` —
        see "API Keys" below); a key needs the `transactions:write`
        scope. Also accepts an optional `Idempotency-Key` header so a
        network retry can't double-submit — see "Idempotency" below.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Opt-in. Same key + same request body within the TTL
            (`IDEMPOTENCY_KEY_TTL_HOURS`, default 24h) replays the
            original response instead of reprocessing (the response
            carries an `Idempotent-Replay: true` header on replay);
            same key + a different body returns 409.
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
            example:
              amount: 2450.00
              merchant: CryptoExchange Pro
              category: crypto
              location: "Unknown"
              card_type: prepaid
      responses:
        "201":
          description: Transaction created and scored (or replayed from a prior identical request — see the Idempotency-Key header)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionAnalysisResponse"
        "400":
          description: Validation failed (e.g. bad amount, unrecognized category/location, malformed Idempotency-Key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: API key is missing the transactions:write scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Idempotency-Key was already used with a different request body, or a request with it is still in flight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /transactions/stats:
    get:
      tags: [Transactions]
      summary: Dashboard statistics
      description: Regular users get their own stats; admins get system-wide stats.
      responses:
        "200":
          description: Aggregate stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionStats"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /transactions/bulk:
    post:
      tags: [Transactions]
      summary: Score a batch of transactions in one request
      description: |
        Feature: bulk transaction import/batch scoring. Each row runs
        through the exact same pipeline as `POST /transactions` above —
        the same alerts, webhooks, live feed, and step-up eligibility —
        so a batch-imported transaction is never a second-class citizen
        next to one entered one at a time. Capped at 50 rows per
        request. A malformed row fails the whole request before
        anything is created (standard validation error); a row that
        throws *during* scoring (rare) is reported per-row instead of
        failing the rest of the batch. Always audit-logged as
        `transactions.bulk_create`, regardless of auth method — unlike
        the single-transaction endpoint, which only audits API-key
        callers. No idempotency support (the key scheme is built around
        a single transaction body, not an array). See
        `routes/transactions.js`'s `scoreAndCreateTransaction`, shared
        with the single-transaction endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactions]
              properties:
                transactions:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: "#/components/schemas/CreateTransactionRequest"
      responses:
        "201":
          description: Every row was accepted for scoring (individual rows may still report a per-row error — check `results[].error`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                    properties:
                      total: { type: integer }
                      completed: { type: integer }
                      flagged: { type: integer, description: "medium or high risk, and not held for step-up" }
                      held_for_step_up: { type: integer }
                      failed: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer, description: "0-based position in the submitted transactions array" }
                        transaction:
                          $ref: "#/components/schemas/Transaction"
                        step_up:
                          type: object
                          nullable: true
                        analysis:
                          type: object
                        error: { type: string, description: "Present instead of transaction/step_up/analysis if this row failed during scoring" }
        "400":
          description: Empty array, more than 50 rows, or a malformed row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /transactions/export:
    get:
      tags: [Transactions]
      summary: CSV export
      description: |
        Same filters and role-based scoping as `GET /transactions`,
        capped at 10,000 rows. Registered before `/{id}` so "export" is
        never swallowed as an `:id` path parameter. Accepts either a
        JWT bearer token or an API key with the `transactions:read`
        scope, same as the list endpoint.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: merchant
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema:
            type: string
            enum: [grocery, food, electronics, travel, entertainment, utilities, clothing, health, crypto, gambling, wire_transfer]
        - name: riskLevel
          in: query
          schema: { type: string, enum: [low, medium, high] }
        - name: dateFrom
          in: query
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          schema: { type: string, format: date-time }
        - name: amountMin
          in: query
          schema: { type: number }
        - name: amountMax
          in: query
          schema: { type: number }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: API key is missing the transactions:read scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/{id}:
    get:
      tags: [Transactions]
      summary: View a single transaction's full record
      description: |
        Includes the full `shap_explanation` and `fraud_reasons` — this
        is what the frontend's transaction detail page and the Alerts/
        Transactions list link into, so a transaction's explanation stays
        reachable after the moment it was created (not just in the
        Simulator's result panel). Audit-logged (`transactions.view`).
        Only the transaction's owner or an admin may view it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /transactions/{id}/step-up:
    get:
      tags: [Transactions]
      summary: Poll a transaction's step-up challenge status
      description: |
        Feature: step-up authentication. A medium-risk transaction is
        only ever held for step-up when the account has a webhook
        subscribed to `transaction.step_up_required` (or `*`) — see
        `POST /transactions` below and `models/stepUpRepository.js`.
        404s if this transaction was never held for one. Only the
        transaction's owner or an admin may poll it.

        While the challenge is still `pending`, the response includes
        `challenge.challenge_token` — the same authorization boundary
        that gates this endpoint (owner or admin) already gates
        `POST .../step-up/verify`, so this is how a flow abandoned
        before it was resolved (e.g. the browser tab was closed) can
        still be recovered and completed later, rather than being
        stuck in `pending_step_up` forever. Once resolved, the token
        is omitted.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The challenge's current status
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction_status: { type: string, enum: [pending_step_up, completed, blocked] }
                  challenge:
                    type: object
                    properties:
                      status: { type: string, enum: [pending, verified, failed] }
                      method: { type: string, example: otp }
                      expires_at: { type: string, format: date-time }
                      verified_at: { type: string, format: date-time, nullable: true }
                      challenge_token: { type: string, description: "Only present while status is pending — see above" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /transactions/{id}/step-up/verify:
    post:
      tags: [Transactions]
      summary: Resolve a pending step-up challenge
      description: |
        FraudGuard never runs the actual OTP/3DS flow itself — this
        endpoint is where the merchant's own verification flow reports
        back its outcome. `outcome: "success"` completes the
        transaction; `"failure"` blocks it. A resolved challenge cannot
        be verified again. Only the transaction's owner or an admin may
        call this.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token, outcome]
              properties:
                challenge_token: { type: string }
                outcome: { type: string, enum: [success, failure] }
      responses:
        "200":
          description: The challenge was resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Step-up verification recorded }
                  step_up_outcome: { type: string, enum: [success, failure] }
                  transaction:
                    $ref: "#/components/schemas/Transaction"
        "400":
          description: Invalid outcome value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such transaction, or the challenge_token doesn't match its pending challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This challenge was already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

