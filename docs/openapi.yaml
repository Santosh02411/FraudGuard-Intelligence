                  alert:
                    $ref: "#/components/schemas/Alert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /alerts/{id}/explanation:
    get:
      tags: [Alerts]
      summary: Get a plain-language explanation of why this alert fired
      description: |
        Feature: LLM-generated plain-language explanations. One sentence,
        generated on first request and cached on the alert row (repeat
