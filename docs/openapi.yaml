            text/csv:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /alerts/bulk-resolve:
    patch:
      tags: [Alerts]
      summary: Resolve up to 100 alerts in one request
      description: |
        Same verdict/note semantics as `PATCH /alerts/{id}/resolve`,
        applied to a batch. All-or-nothing: if any id in `alertIds` is
        missing or not owned by the caller (non-admins only), the whole
        batch is rejected and nothing is touched — a bulk action
        silently succeeding for only some of the requested alerts would
        be a worse failure mode than requiring a retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alertIds, verdict]
              properties:
                alertIds:
                  type: array
                  items: { type: integer, minimum: 1 }
                  minItems: 1
                  maxItems: 100
                verdict:
                  type: string
                  enum: [confirmed_fraud, false_positive]
                note:
                  type: string
                  maxLength: 1000
      responses:
        "200":
          description: All alerts in the batch resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "3 alert(s) resolved" }
                  resolvedCount: { type: integer }
                  alertIds:
                    type: array
                    items: { type: integer }
        "400":
          description: Invalid body (empty/oversized alertIds, missing verdict)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: One or more alerts in the batch belong to another user (non-admin caller)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: One or more alertIds do not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alerts/{id}:
    get:
      tags: [Alerts]
      summary: View a single alert
      description: Audit-logged (`alerts.view`). Only the alert's owner or an admin may view it.
      parameters:
