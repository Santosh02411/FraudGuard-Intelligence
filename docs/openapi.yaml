      responses:
        "200":
          description: Explanation
          content:
            application/json:
              schema:
                type: object
                properties:
                  explanation: { type: string, example: This was flagged mainly for its unusually large amount and a mismatched shipping location. }
                  cached: { type: boolean, description: "true if this was already generated for this alert and served from the cached copy" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

