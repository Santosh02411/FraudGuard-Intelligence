name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  backend:
    name: Backend (lint, tests, coverage thresholds)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - name: Tests with coverage (fails below thresholds in package.json)
        run: npx jest --coverage --ci
        env: { JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789 }
      - name: Publish results
        if: always()
        working-directory: .
        run: node scripts/ci/summarize.js "Backend (SQLite)" --junit backend/test-results/junit.xml --coverage backend/coverage/coverage-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: |
            backend/test-results
            backend/coverage

  backend-postgres:
    name: Backend on PostgreSQL (concurrency, realtime, governance, cases)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: fg_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fg_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      # Suites share one database and some assume an empty one, so each group gets a fresh schema.
      - name: Run each suite against a clean database
        run: |
          set -e
          for f in tests/concurrency tests/realtime tests/governance tests/integration/decisionAudit.test.js tests/integration/alertCases.test.js; do
            PGPASSWORD=postgres psql -h localhost -U postgres -qc "DROP DATABASE IF EXISTS fg_test" -c "CREATE DATABASE fg_test" -d postgres
            echo "::group::$f"; npx jest --runInBand --forceExit --ci "$f"; echo "::endgroup::"
          done

  ml-service:
    name: ML service (tests + coverage)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml_service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ env.PYTHON_VERSION }}', cache: pip, cache-dependency-path: 'ml_service/requirements*.txt' }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest (fails under 45% coverage, see .coveragerc)
        run: python -m pytest -q --cov=. --cov-report=term --cov-report=xml --junitxml=junit.xml
      - name: Publish results
        if: always()
        working-directory: .
        run: node scripts/ci/summarize.js "ML service" --junit ml_service/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-results
          path: |
            ml_service/junit.xml
            ml_service/coverage.xml

  frontend:
    name: Frontend (lint, tests, production build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx eslint src --ext .js,.jsx --max-warnings=0
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Production build
        run: npm run build
        env: { CI: 'true' }
      - name: Publish results
        if: always()
        working-directory: .
        run: node scripts/ci/summarize.js "Frontend" --coverage frontend/coverage/coverage-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: frontend-results, path: frontend/coverage }

  e2e:
    name: Full-stack E2E (real ML service + real backend)
    runs-on: ubuntu-latest
    needs: [backend, ml-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: backend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: '${{ env.PYTHON_VERSION }}', cache: pip, cache-dependency-path: 'ml_service/requirements*.txt' }
      - run: pip install -r ml_service/requirements.txt
      - run: npm ci
        working-directory: backend
      - run: bash scripts/e2e-fullstack.sh
        working-directory: backend

  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    needs: [backend]
    defaults: { run: { working-directory: backend } }
    env:
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      PERF_BUDGET_SCALE: '2' # shared runners are slower and noisier than a dev machine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run test:perf
      - name: Publish results
        if: always()
        working-directory: .
        run: node scripts/ci/summarize.js "Performance" --perf backend/perf-results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: perf-results, path: backend/perf-results }

  # Anything that deploys must depend on this job, so a red check blocks the release.
  ready-to-deploy:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [backend, backend-postgres, ml-service, frontend, e2e, performance]
    steps:
      - run: echo "All required checks passed."

  cognee-service:
    name: Cognee memory service (pytest, real Cognee SDK, offline model stand-ins)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cognee_service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: cognee_service/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
